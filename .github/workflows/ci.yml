name: ci

on:
  push:
    paths:
      - "**.f90"
      - "**.F90"
      - "**.cmake"
      - "**/CMakeLists.txt"
      - ".github/workflows/ci.yml"
  workflow_dispatch:

# avoid wasted runs
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true


jobs:

  ubuntu24:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10

    strategy:
      matrix:
        os: [ubuntu-24.04]
        gcc_version: [12, 13, 14]
        include:
        - os: macos-latest
          gcc_version: 15

    env:
      FC: gfortran-${{ matrix.gcc_version }}

    steps:

    - &checkout
      uses: actions/checkout@v6

    - &setup-python
      uses: actions/setup-python@v6
      with:
        python-version: '3.14'

    - &install-pytest
      name: install pytest
      run: python -m pip install -r requirements-dev.txt

    - &work-default
      run: cmake --workflow default


  ubuntu26-gcc:
    runs-on: ubuntu-26.04
    timeout-minutes: 5

    strategy:
      matrix:
        gcc_version: [15]

    env:
      FC: gfortran-${{ matrix.gcc_version }}

    steps:
    - *checkout
    - *setup-python
    - *install-pytest
    - *work-default

    - name: Downloadable rpncalc executable
      uses: actions/upload-artifact@v7
      if: success()
      with:
        name: rpncalc
        path: build/rpncalc


  ubuntu26-flang:
    runs-on: ubuntu-26.04
    timeout-minutes: 10

    strategy:
      matrix:
        llvm-version: [22]

    env:
      FC: flang-${{ matrix.llvm-version }}

    steps:
    - *checkout

    - name: install Flang
      run: |
        sudo apt-get update
        sudo apt-get install -y flang-${{ matrix.llvm-version }}

    - *work-default


  windows-gcc:
    runs-on: windows-latest
    timeout-minutes: 5

    steps:
    - uses: fortran-lang/setup-fortran@v1
      id: setup-fortran
      with:
        compiler: gcc
        version: 15

    - *checkout
    - *setup-python
    - *install-pytest
    - *work-default

    - name: Downloadable rpncalc.exe
      uses: actions/upload-artifact@v7
      if: success()
      with:
        name: rpncalc.exe
        path: build/rpncalc.exe
