name: ci

on:
  push:
    paths:
      - "**.f90"
      - "**.F90"
      - "**.cmake"
      - "**/CMakeLists.txt"
      - ".github/workflows/ci.yml"
  workflow_dispatch:

# avoid wasted runs
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true


jobs:

  gcc-new:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10

    strategy:
      matrix:
        os: [ubuntu-24.04]
        gcc_version: [12, 13, 14]
        include:
        - os: macos-latest
          gcc_version: 15

    env:
      FC: gfortran-${{ matrix.gcc_version }}

    steps:

    - &checkout
      uses: actions/checkout@v6

    - &setup-python
      uses: actions/setup-python@v6
      with:
        python-version: '3.14'

    - &install-pytest
      name: install pytest
      run: python -m pip install -r requirements-dev.txt

    - &work-default
      run: cmake --workflow default

    - name: Downloadable rpncalc.exe
      uses: actions/upload-artifact@v7
      if: success()
      with:
        name: rpncalc
        path: build/rpncalc


  flang:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15

    strategy:
      matrix:
        os: [macos-latest]

    env:
      FC: flang
      HOMEBREW_NO_INSTALL_CLEANUP: 1

    steps:
    - *checkout

    - name: install Flang (macOS)
      if: runner.os == 'macOS'
      run: brew install flang

    - *work-default


  gcc-old:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10

    strategy:
      matrix:
        os: [ubuntu-22.04]
        gcc_version: [9, 10, 11]

    env:
      FC: gfortran-${{ matrix.gcc_version }}

    steps:
    - *checkout

    - *work-default


  windows-msys:
    runs-on: windows-latest
    timeout-minutes: 10

    env:
      CMAKE_GENERATOR: Ninja

    steps:
    - uses: msys2/setup-msys2@v2
      id: msys2
      with:
        update: true
        install: >-
          mingw-w64-ucrt-x86_64-gcc-fortran

    - name: Put MSYS2_MinGW64 on PATH
      shell: bash
      run: echo "${{ steps.msys2.outputs.msys2-location }}/ucrt64/bin" >> $GITHUB_PATH

    - *checkout
    - *setup-python
    - *install-pytest
    - *work-default

    - name: Downloadable rpncalc.exe
      uses: actions/upload-artifact@v7
      if: success()
      with:
        name: rpncalc.exe
        path: build/rpncalc.exe
