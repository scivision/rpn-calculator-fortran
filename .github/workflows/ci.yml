name: ci

on:
  push:
    paths:
      - "**.f90"
      - "**.F90"
      - "**.cmake"
      - "**/CMakeLists.txt"
      - ".github/workflows/ci.yml"
  workflow_dispatch:

# avoid wasted runs
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CMAKE_GENERATOR: Ninja
  CMAKE_BUILD_TYPE: Release


jobs:

  gcc-new:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10

    strategy:
      matrix:
        os: [ubuntu-24.04]
        gcc_version: [12, 13, 14]
        include:
        - os: macos-latest
          gcc_version: 14

    env:
      FC: gfortran-${{ matrix.gcc_version }}

    steps:
    - uses: actions/setup-python@v5
      with:
        python-version: '3.x'

    - name: install pytest
      run: python -m pip install numpy scipy pytest

    - uses: actions/checkout@v4

    - run: cmake --workflow default


  linux-flang:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    env:
      FC: flang-new

    steps:
    - uses: actions/checkout@v4

    - name: install Flang
      run: sudo apt install --no-install-recommends flang

    - run: cmake --workflow default


  gcc-old:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10

    strategy:
      matrix:
        os: [ubuntu-22.04]
        gcc_version: [9, 10, 11]

    env:
      FC: gfortran-${{ matrix.gcc_version }}

    steps:
    - uses: actions/checkout@v4

    - run: cmake --workflow default


  windows-msys:
    runs-on: windows-latest
    timeout-minutes: 10

    steps:
    - uses: msys2/setup-msys2@v2
      id: msys2
      with:
        update: true
        install: >-
          mingw-w64-ucrt-x86_64-gcc-fortran

    - name: Put MSYS2_MinGW64 on PATH
      shell: bash
      run: echo "${{ steps.msys2.outputs.msys2-location }}/ucrt64/bin" >> $GITHUB_PATH

    - uses: actions/setup-python@v5
      with:
        python-version: '3.x'

    - name: install pytest
      run: python -m pip install numpy scipy pytest

    - uses: actions/checkout@v4

    - run: cmake --workflow default

    - name: .exe for release
      uses: actions/upload-artifact@v4
      if: success()
      with:
        name: rpncalc.exe
        path: build/rpncalc.exe
